<!DOCTYPE html>
<html>
<body>
    <button id="scan">Scan</button>

    <script>
        const scanSocket = new WebSocket("ws://localhost:3000/scan");

        scanSocket.onopen = () => {
            console.log("Connected to /scan");
        };

        scanSocket.onmessage = (event) => {
            console.log("Received:", JSON.parse(event.data));
        };

        document.getElementById("scan").onclick = () => {
            scanSocket.send("scan");
        };
    </script>
</body>
</html>
